# Secure development pipeline (SR-31)
# Every push / pull request is tested and scanned; any failure turns the run red.
name: secure-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Run tests with coverage
        run: pytest --cov=app --cov=client --cov-report=term-missing

  security:
    name: Security scan (Bandit + pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      # -ll = report MEDIUM and HIGH findings; any finding exits non-zero and fails the job
      - name: Static analysis (Bandit)
        run: bandit -r app client tools -ll
      # exits non-zero if any dependency has a known CVE
      - name: Dependency CVE scan (pip-audit)
        run: pip-audit -r requirements.txt

  # SR-25: signed release. Runs only on main, after test + security pass.
  release:
    name: Signed release (SBOM + manifest)
    needs: [test, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Generate SBOM (CycloneDX)
        run: cyclonedx-py requirements requirements.txt -o sbom.json
      # RELEASE_SIGNING_KEY = base64 raw Ed25519 private key (GitHub repository secret)
      - name: Sign release manifest
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: python tools/sign_release.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed-release
          path: |
            sbom.json
            release/manifest.json
